# The kit's Python environment, locked with file hashes in uv.lock.
# Maintainer: change versions here, then `uv lock` (see MAINTAINING.md). Scribes never run uv lock;
# the wizard installs exactly what uv.lock lists and refuses any file whose hash does not match.
[project]
name = "meeting-minutes-env"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "whisperx==3.8.6",
  "pyannote-audio==4.0.7",
  "faster-whisper==1.2.1",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "markitdown[xlsx,docx,pdf]==0.1.8",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchaudio==2.8.0"]
cu128 = ["torch==2.8.0", "torchaudio==2.8.0", "nvidia-cublas-cu12==12.9.2.10", "nvidia-cudnn-cu12==9.27.0.42"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# everything else at the versions tested together on a working install
constraint-dependencies = [
