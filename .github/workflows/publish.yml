# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted publishing: no npm token is
# stored anywhere, GitHub proves the identity to npm, and the package gets a provenance attestation.
# Actions are pinned to commit SHAs so a moved tag cannot change what runs here.
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
